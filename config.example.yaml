# MK Startside konfiguration
# Kopiér til config.yaml på serveren: /srv/apps/mkstartside/config.yaml
# Rediger den og genstart tjenesten: systemctl restart mkstartside
# config.yaml er i .gitignore — den levende konfiguration hører ikke i git.

by: Aarhus

lokation:
  lat: 56.15
  lon: 10.21

# Links samles i grupper — det er grupperne der gør siden overskuelig.
# `status:` er valgfri. Er den sat, får linket en prik der viser om tjenesten
# kører. Nøglen slås op i det statusd-agenterne (se servere: nedenfor) svarer,
# og har formen <slags>:<navn>:
#
#   docker:vikunja    en container på en vært med STATUSD_DOCKER=1
#   unit:flask_dnd    en systemd-tjeneste nævnt i vertens STATUSD_UNITS
#   lxc:apps-mk       en LXC på Proxmox-værten (STATUSD_LXC=1)
#   vaert:Proxmox     selve agenten — navnet er det fra servere: nedenfor
#
# Findes nøglen ikke i svaret (fx fordi agenten er nede), bliver prikken grå
# "ukendt" i stedet for rød — vi ved det ikke, og det er ikke det samme som nede.
# Links uden `status:` får ingen prik. Det er det rigtige for alt vi ikke selv
# driver, fx eksterne sider.
grupper:
  - titel: Eksterne
    links:
      - titel: Eksempel
        url: https://example.com

  - titel: Egne apps
    links:
      - titel: Min app
        url: https://app.example.com
        status: unit:min_app

  # `plads: drift` flytter gruppen over i driftskortet til venstre. Links med
  # `status: vaert:<navn>` bliver dér til værtens egen linje med load, RAM og
  # oppetid — resten står som en fodnote nederst i kortet. Uden `plads:` ender
  # gruppen i link-kortet til højre, som alle andre.
  - titel: Drift
    plads: drift
    links:
      - titel: Proxmox
        url: https://proxmox.example.com/
        status: vaert:Proxmox
      - titel: Et drifts-værktøj
        url: https://vaerktoej.example.com/
        status: docker:vaerktoej

# Hvor længe siden hver backup-disk sidst kørte (valgfrit).
# Filen SKRIVES af den maskine der tager backup — den spørges ikke. En bærbar
# der er slukket ville ellers give "ukendt" netop når man har været væk længe og
# derfor ikke har fået taget backup; her står tidsstemplet i stedet stille, og
# alderen vokser af sig selv. Se kilder/backup.py.
#
# Tærsklerne er pr. disk, fordi kadencerne er det: en disk i dock skal køre
# dagligt, en disk i et pengeskab ugentligt, et koldt lager sjældnere.
#   gul_dage   herover bliver prikken gul  ("ved at blive gammel")
#   roed_dage  herover bliver den rød      ("for længe siden")
# En kørsel der ikke endte i `ok` bliver rød uanset alder.
# backup:
#   fil: /srv/apps/mkstartside/state/backup-status.json
#   diske:
#     - navn: SeaExt          # skal matche labelen i afsenderens diske.conf
#       titel: SeaExt         # valgfri, ellers bruges navn
#       kadence: dagligt      # kun tekst, står dæmpet efter navnet
#       gul_dage: 2
#       roed_dage: 4

# Nye udgaver af docker-apps'ene (valgfrit).
# Den kørende version kommer fra statusd-agenten på docker-værten, så en app
# skal være en container på en vært med STATUSD_DOCKER=1 for at kunne tjekkes.
# Nyeste udgave slås op på GitHub — derfor `repo:`.
#
# Kun applikationerne hører her. Databaserne (postgres:15-alpine,
# redis:7-alpine) er serie-tags: de genbygges løbende med sikkerhedsrettelser
# inden for serien og opdateres af et almindeligt `docker compose pull`, uden at
# hoppe major. Der er ingen "ny release" at opdage — kun et nyere build.
#
# calibre-web sammenlignes mod UPSTREAM (janeczku). Kører du LinuxServers image,
# er `-lsNNN` deres eget build-nummer, og der ses bort fra det. "Nyeste" betyder
# altså at upstream-versionen matcher — ikke at der ikke findes en nyere -lsNNN
# med patchede systempakker. Den fanges kun af `docker compose pull`.
#
# Listen bør holdes op mod `docker ps` på værten, hver gang der kommer en ny
# app: en container der ikke står her, bliver aldrig tjekket og larmer aldrig.
# versioner:
#   apps:
#     - container: paperless          # navnet i `docker ps`
#       repo: paperless-ngx/paperless-ngx
#       titel: Paperless              # valgfri, ellers bruges container
#     - container: miniflux
#       repo: miniflux/v2

